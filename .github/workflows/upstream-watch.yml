# Weekly: build and test against the latest original EdenText and HOP (with HOP's rhwp).
# A failure means an upstream change would break our overlays; an issue is opened once.
# The check job executes unreviewed upstream code, so it holds a read-only token that is not
# persisted to disk; only the report job, which runs no upstream code, may write issues.
# The npm job below follows the same split.
name: upstream-watch
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Restore pinned upstreams
        run: npm run upstream:sync
      - name: Check latest upstreams
        run: npm run upstream:check
      - name: Report candidate
        if: always()
        run: cat artifacts/candidate-verified.json || true
  report:
    needs: latest
    if: failure()
    runs-on: ubuntu-latest
    # Overlapping runs would both find no open issue and each open one.
    concurrency:
      group: upstream-watch-report
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open or update the breakage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Latest upstream breaks Sketch Docs"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "upstream:check failed against the latest EdenText/HOP. The pinned versions are unchanged and the service is unaffected. Details: $RUN_URL"
          fi
  # Weekly: is there a newer svelte-pdf-mini than our exact pin, and does npm report an advisory for
  # what we ship? Reads registry data only (the audit uses the lockfile; nothing is installed or run).
  # A new release is a prompt to review and test it by hand; the pin is never changed here.
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pinned: ${{ steps.check.outputs.pinned }}
      latest: ${{ steps.check.outputs.latest }}
      audit: ${{ steps.check.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - id: check
        name: Compare svelte-pdf-mini and audit production dependencies
        run: |
          pinned=$(node -p "require('./package.json').dependencies['svelte-pdf-mini']")
          latest=$(npm view svelte-pdf-mini version)
          echo "svelte-pdf-mini pinned $pinned, latest $latest"
          if npm audit --omit=dev; then audit=clean; else audit='not clean (advisory or audit error, see the run log)'; fi
          { echo "pinned=$pinned"; echo "latest=$latest"; echo "audit=$audit"; } >> "$GITHUB_OUTPUT"
  npm-report:
    needs: npm
    if: always() && (needs.npm.result != 'success' || needs.npm.outputs.pinned != needs.npm.outputs.latest || needs.npm.outputs.audit != 'clean')
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-watch-npm-report
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open or update the npm check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.npm.result }}
          PINNED: ${{ needs.npm.outputs.pinned }}
          LATEST: ${{ needs.npm.outputs.latest }}
          AUDIT: ${{ needs.npm.outputs.audit }}
        run: |
          title="npm check needs attention"
          body="Check: $RESULT. svelte-pdf-mini pinned $PINNED, latest $LATEST. npm audit --omit=dev: $AUDIT. The service is unaffected; nothing was changed. Details: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
