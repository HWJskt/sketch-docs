# Light checks on every push: type checks and the contract/unit tests, which need neither Rust nor a
# browser. The full release gate (engine builds and Chrome regressions) runs locally before every push:
# the pre-push hook (scripts/push-gate.mjs, npm run hooks:install) requires a passing npm run verify for
# the tip of each pushed ref, and re-verifies it in a worktree, then once more as an English Chrome,
# when the saved report does not cover it.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Type checks
        run: npm run check
      - name: Contract and unit tests
        run: npm run test:contracts
