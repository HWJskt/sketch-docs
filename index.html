<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdenText — Word·한글 문서 편집기</title>
    <meta
      name="description"
      content="Word와 한글 문서를 각 형식의 편집기로 작성하고 로컬 파일로 저장합니다."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#e6e9eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2f2f31" media="(prefers-color-scheme: dark)" />
    <style>
      body { margin: 0; }
      #start-screen { box-sizing: border-box; min-height: 100dvh; padding: clamp(40px, 10vh, 110px) 24px; background: #f4f6fa; color: #18243a; font-family: system-ui, sans-serif; text-align: center; }
      #start-screen * { box-sizing: border-box; }
      .start-brand { color: #5b6980; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      #start-screen h1 { margin: 22px 0 12px; font-size: clamp(26px, 4vw, 38px); letter-spacing: -1px; }
      .start-description { color: #647084; margin: 0; }
      .start-options { max-width: 820px; margin: 42px auto 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; text-align: left; }
      .start-card { display: block; padding: 30px; border: 1px solid #dce3ed; border-radius: 18px; background: white; color: inherit; text-decoration: none; box-shadow: 0 8px 30px #18243a06; }
      .start-card:hover { border-color: #6e93ca; box-shadow: 0 10px 30px #18243a14; }
      .start-card:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
      .format-icon { display: grid; place-items: center; width: 54px; height: 62px; border-radius: 10px; font-size: 27px; font-weight: 750; background: #e8f0ff; color: #245bc1; }
      .hangul-card .format-icon { background: #e4f5ef; color: #147759; }
      #start-screen h2 { display: inline-block; margin: 23px 10px 0 0; font-size: 23px; }
      .format-tag { font-size: 12px; color: #667389; }
      .start-card p { color: #647084; font-size: 15px; line-height: 1.7; min-height: 52px; }
      .start-card strong { display: flex; justify-content: space-between; margin-top: 28px; font-size: 15px; color: #245bc1; }
      .hangul-card strong { color: #147759; }
      .start-note { color: #778195; font-size: 13px; line-height: 1.7; }
      #editor-loading { padding: 48px; font-family: system-ui, sans-serif; color: #536176; }
      @media (max-width: 600px) { .start-options { grid-template-columns: 1fr; gap: 16px; margin-top: 28px; } .start-card { padding: 24px; } .start-card p { min-height: 0; } }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="start-screen">
        <div class="start-brand">EDENTEXT · 문서 편집기</div>
        <h1>어떤 문서를 작성할까요?</h1>
        <p class="start-description">문서 형식을 선택하면 전용 편집기가 열립니다.</p>
        <nav class="start-options" aria-label="문서 형식 선택">
          <a class="start-card word-card" href="./word.html">
            <span class="format-icon" aria-hidden="true">W</span>
            <h2>Word 문서</h2><span class="format-tag">DOCX</span>
            <p>Word 문서를 작성하거나 기존 문서를 열어 편집합니다.</p>
            <strong>Word 편집기 열기 <span aria-hidden="true">→</span></strong>
          </a>
          <a class="start-card hangul-card" href="./hwp.html?new=1">
            <span class="format-icon" aria-hidden="true">한</span>
            <h2>한글 문서</h2><span class="format-tag">HWP · HWPX</span>
            <p>한글 전용 편집기로 작성하고 HWPX 또는 HWP로 저장합니다.</p>
            <strong>한글 편집기 열기 <span aria-hidden="true">→</span></strong>
          </a>
        </nav>
        <p class="start-note">로컬 파일 열기와 저장은 데스크톱 Chrome·Edge에서 사용할 수 있습니다.</p>
        <noscript>문서를 편집하려면 JavaScript를 활성화해 주세요.</noscript>
      </main>
    </div>
    
    <script type="module" src="/src/offline.ts"></script>
  </body>
</html>
